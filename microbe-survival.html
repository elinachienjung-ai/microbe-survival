const EventBus = {

  on(ev, fn) { (this.map[ev] = this.map[ev] || []).push(fn); },
  off() { this.map = {}; },
  emit(ev, data) { (this.map[ev] || []).forEach(fn => fn(data)); },
};

/* Sound: everything is synthesized with Web Audio, no sound files */
const Sound = {
  ac: null, master: null, music: null, musicT: 0,
  init() {

    this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = save().sound ? 0.6 : 0; this.master.connect(this.ac.destination);
    this.music = this.ac.createGain(); this.music.gain.value = 0.22; this.music.connect(this.master);
    // iPhone: web audio normally follows the silent switch. Asking for "playback" (like a video) lets it play anyway.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);

    } catch (e) {}
  },
  setOn(on) { save().sound = on; SaveManager.save(); if (this.master) this.master.gain.value = on ? 0.6 : 0; },
  tone(freq, dur, { type = 'sine', vol = 0.3, slide = 0, delay = 0, out = null } = {}) {
    if (!this.ac) return;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  noise(dur, { vol = 0.3, freq = 800, delay = 0 } = {}) {

  play(name, combo = 0) {

    switch (name) {

      case 'select': this.tone(520, 0.05, { type: 'square', vol: 0.06 }); this.tone(780, 0.07, { type: 'triangle', vol: 0.12, delay: 0.04 }); break;
      case 'collect': this.tone(620 * up, 0.12, { vol: 0.25, slide: 1.6 }); this.tone(930 * up, 0.12, { vol: 0.15, delay: 0.06 }); break;
      case 'remove': this.tone(300 * up, 0.18, { type: 'triangle', vol: 0.25, slide: 2.5 }); this.noise(0.12, { vol: 0.12, freq: 3000 }); break;
      case 'wrong': this.tone(180, 0.22, { type: 'sawtooth', vol: 0.12 }); this.tone(150, 0.25, { type: 'sawtooth', vol: 0.1, delay: 0.08 }); break;
      case 'hurt': this.tone(140, 0.25, { type: 'square', vol: 0.14, slide: 0.5 }); this.noise(0.15, { vol: 0.2, freq: 500 }); break;

      case 'craft': [523, 659, 784].forEach((f, i) => this.tone(f, 0.15, { type: 'triangle', vol: 0.18, delay: i * 0.07 })); break;
      case 'spot': this.tone(740, 0.1, { vol: 0.2 }); this.tone(988, 0.18, { vol: 0.2, delay: 0.1 }); break;
      case 'levelup': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, { type: 'triangle', vol: 0.2, delay: i * 0.09 })); break;
      case 'clear': [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, { type: 'triangle', vol: 0.22, delay: i * 0.12 })); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.2, delay: i * 0.18 })); break;
      case 'tick': this.tone(1000, 0.04, { type: 'square', vol: 0.05 }); break;
      case 'power': [784, 988, 1175].forEach((f, i) => this.tone(f, 0.18, { vol: 0.16, delay: i * 0.05 })); break;
      case 'shield': this.tone(600, 0.3, { type: 'triangle', vol: 0.22, slide: 1.5 }); this.tone(900, 0.3, { vol: 0.12, delay: 0.05 }); break;

  },
  musicTick(dt) {                         // gentle underwater ambience, pentatonic notes
    if (!this.ac || !save().sound) return;
    this.musicT -= dt; if (this.musicT > 0) return;
    this.musicT = 900 + Math.random() * 700;
    const scale = [262, 294, 330, 392, 440, 523, 587, 659];
    const f = scale[Math.floor(Math.random() * scale.length)];
    this.tone(f, 1.6, { vol: 0.12, out: this.music });

/* ---------------- 4. SYSTEMS ---------------- */
class StatsSystem {
  constructor(rt) { this.rt = rt; this.co2 = 0; this.water = 0; }
  add({ hp = 0, water = 0 }) {
    const rt = this.rt;
    rt.hp = Math.max(0, Math.min(save().maxHP, rt.hp + hp));
    rt.water = Math.max(0, Math.min(100, rt.water + water));
  }
  tick(dt) {
    if (this.rt.stage.tutorial) return;
    this.co2 += dt; this.water += dt;
    while (this.co2 >= CONFIG.CO2_INTERVAL) { this.co2 -= CONFIG.CO2_INTERVAL; if (this.rt.co2Shield <= 0) this.add({ hp: -CONFIG.CO2_HP_LOSS }); }
    while (this.water >= CONFIG.WATER_INTERVAL) {
      this.water -= CONFIG.WATER_INTERVAL;
      const n = this.rt.entities.filter(e => e.alive && e.kind === 'harmful').length;
      if (n) this.add({ water: -CONFIG.WATER_LOSS * n });
    }
  }
}

class SpawnSystem {
  constructor(rt) { this.rt = rt; this.th = 1000; this.tb = 1500; this.ti = 0; }
  tick(dt) {
    const st = this.rt.stage, ents = this.rt.entities;
    this.th += dt; this.tb += dt; this.ti += dt;
    const alive = k => ents.filter(e => e.alive && e.kind === k).length;
    if (this.th >= st.helpfulEvery * 1000) {
      this.th = 0;
      if (!st.tutorial || alive('helpful') < 1) ents.push(FloatingObject.diatom(pick(st.helpful), st));
    }
    if (this.tb >= st.harmfulEvery * 1000) {
      this.tb = 0;
      if (!st.tutorial || alive('harmful') < 1) ents.push(FloatingObject.diatom(st.newEnemy && st.harmful.length > 1 && Math.random() < 0.4 ? st.newEnemy : pick(st.harmful), st));
    }
    const low = st.harmful.some(h => (this.rt.charges[DIATOMS[h].tool] ?? 9) <= 1);   // running out: ingredients come twice as fast
    if (st.ingredientEvery && this.ti >= st.ingredientEvery * (low ? 500 : 1000)) {
      this.ti = 0;
      const tools = this.rt.tools.filter(t => t !== 'hand'), bag = this.rt.bag;
      let need = st.harmful.map(h => DIATOMS[h].tool).filter(t => tools.includes(t));
      const empty = need.filter(t => this.rt.charges[t] <= 1); if (empty.length) need = empty;
      const tool = TOOLS[pick(need.length && Math.random() < 0.8 ? need : tools)];
      const [a, b] = tool.recipe;
      ents.push(FloatingObject.ingredient((bag[a] || 0) > (bag[b] || 0) ? b : (bag[b] || 0) > (bag[a] || 0) ? a : pick(tool.recipe), st));
    }
  }
}
const pick = a => a[Math.floor(Math.random() * a.length)];

class BloomSystem {
  constructor(rt) { this.rt = rt; }
  tick() {
    if (this.rt.stage.tutorial) return;
    const ents = this.rt.entities;
    let n = ents.filter(e => e.alive && e.kind === 'harmful').length;
    for (const e of ents.slice()) {
      if (!e.alive || e.kind !== 'harmful' || e.state !== 'drifting' || e.age < CONFIG.BLOOM_TIME) continue;
      e.age = 0; if (n >= CONFIG.MAX_HARMFUL) continue;
      const c = FloatingObject.diatom(e.id, this.rt.stage);
      c.x = Math.max(70, Math.min(650, e.x + (Math.random() < 0.5 ? -60 : 60))); c.y = e.y - 20; c.state = 'drifting'; c.alpha = 1; c.pulse = 1; e.pulse = 1;
      ents.push(c); n++;
      EventBus.emit('bloom', { x: e.x, y: e.y });
    }
  }
}

class StageTimer {
  constructor(rt) { this.rt = rt; rt.timeLeft = rt.stage.duration * 1000; this.lastSec = 99; }
  tick(dt) {
    if (!this.rt.stage.duration) return;
    this.rt.timeLeft = Math.max(0, this.rt.timeLeft - dt);
    const s = Math.ceil(this.rt.timeLeft / 1000); if (s !== this.lastSec && s <= 10 && s > 0) Sound.play('tick'); this.lastSec = s;
  }
  check() {
    const rt = this.rt, st = rt.stage;
    if (rt.ended || st.tutorial) return null;
    if (rt.hp <= 0) return { win: false, reason: 'hp' };
    if (rt.water <= 0) return { win: false, reason: 'water' };
    if (rt.timeLeft <= 0) {
      if (rt.water >= st.passWater) return { win: true, stars: st.stars.filter(s => rt.water >= s).length };
      return { win: false, reason: 'water_low' };
    }
    return null;
  }
}

const ProgressSystem = {
  nextLevel() { return LEVELS.find(l => l.level === save().level + 1); },
  startCharges() { return CONFIG.START_CHARGES + Math.min(3, save().level - 1); },
  addXP(n) {
    const s = save(); s.xp += n;
    let next = this.nextLevel();
    while (next && s.xp >= next.xp) {
      s.level = next.level; if (next.level === 5) s.maxHP = 120;
      EventBus.emit('level:up', { level: s.level, reward: next.reward });
      next = this.nextLevel();
    }
    SaveManager.save();
  },
};

/* ---------------- 5. OBJECTS ---------------- */
class FloatingObject {
  static base(kind, stage) {
    const o = new FloatingObject();
    Object.assign(o, { kind, alive: true, state: 'spawning', alpha: 0, age: 0, t: Math.random() * 5000, pulse: 0, tapT: 0, shake: 0 });
    return o;
  }
  static horizontal(o, stage) {
    const fromLeft = Math.random() < 0.5, top = CONFIG.PLAY_TOP, ph = FARM_TOP() - top;
    o.x = fromLeft ? -o.w / 2 + 10 : CONFIG.W + o.w / 2 - 10;
    o.y = top + ph * (0.12 + Math.random() * 0.65);
    const sp = stage.hSpeed[0] + Math.random() * (stage.hSpeed[1] - stage.hSpeed[0]);
    o.vx = sp * (fromLeft ? 1 : -1); o.vy = (Math.random() - 0.5) * 16;
  }
  static diatom(id, stage) {
    const o = FloatingObject.base(DIATOMS[id].type, stage);
    o.id = id; o.frame = Math.floor(Math.random() * 4);
    const im = Assets.sprite(id, o.frame), s = CONFIG.SPRITE_SIZE / Math.max(im.width, im.height);
    o.w = im.width * s; o.h = im.height * s;
    if (o.kind === 'helpful') FloatingObject.horizontal(o, stage);
    else {                                                    // harmful: sink from the top toward the farm
      o.x = 90 + Math.random() * 540; o.y = CONFIG.PLAY_TOP + o.h * 0.35;
      o.vx = (Math.random() - 0.5) * 30; o.vy = stage.sink[0] + Math.random() * (stage.sink[1] - stage.sink[0]);
    }
    o.r = Math.max(CONFIG.MIN_HIT / 2, Math.max(o.w, o.h) * 0.42);
    return o;
  }
  static ingredient(id, stage) {
    const o = FloatingObject.base('ingredient', stage); o.id = id; o.w = o.h = 84; o.r = 52;
    FloatingObject.horizontal(o, stage); o.vx *= 0.8; return o;
  }
  update(dt) {
    this._dt = dt; this.t += dt; this.age += dt;
    if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt / 400);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt / 300);
    if (this.state === 'spawning') { this.alpha = Math.min(1, this.alpha + dt / 300); if (this.alpha >= 1) this.state = 'drifting'; }
    if (this.state === 'tapped') { this.tapT += dt; this.alpha = Math.max(0, 1 - this.tapT / 250); if (this.tapT >= 250) this.alive = false; return; }
    const sway = this.kind === 'harmful' ? Math.sin(this.t / 900) * 18 : 0;
    this.x += (this.vx + sway) * dt / 1000; this.y += this.vy * dt / 1000;
    if (this.kind === 'harmful') {
      if (this.x < 60 || this.x > 660) { this.vx = -this.vx; this.x = Math.max(60, Math.min(660, this.x)); }
    } else {
      const top = CONFIG.PLAY_TOP + this.h / 2, bottom = FARM_TOP() - this.h / 2;
      if (this.y < top || this.y > bottom) { this.vy = -this.vy; this.y = Math.max(top, Math.min(bottom, this.y)); }
      if (this.x < -this.w || this.x > CONFIG.W + this.w) this.alive = false;
    }
  }
  every(key, ms) { this.fx = this.fx || {}; this.fx[key] = (this.fx[key] ?? Math.random() * ms) + this._dt; if (this.fx[key] >= ms) { this.fx[key] = 0; return true; } return false; }
  reachedFarm() { return this.kind === 'harmful' && this.state !== 'tapped' && this.y + this.h * 0.25 >= FARM_TOP() + 20; }
  wy() { return this.y + Math.sin(this.t / 2000 * Math.PI * 2) * 7; }
  hit(x, y) { return this.alive && this.state !== 'tapped' && Math.hypot(x - this.x, y - this.wy()) <= this.r; }
  draw(g) {
    const sc = 1 + this.pulse * 0.25 + (this.state === 'tapped' ? this.tapT / 250 * 0.4 : 0);
    g.save(); g.globalAlpha = this.alpha;
    g.translate(this.x + Math.sin(this.t / 25) * this.shake * 10, this.wy());
    g.rotate(Math.sin(this.t / 700) * 6 * Math.PI / 180);   // every diatom tilts the same way: no hints
    g.scale(sc, sc);
    if (this.id === 'pseu') {                                   // faint pulsing toxic haze
      const r = this.h * 0.55, gr = g.createRadialGradient(0, 0, 10, 0, 0, r);
      gr.addColorStop(0, `rgba(170,60,200,${0.32 + Math.sin(this.t / 300) * 0.12})`); gr.addColorStop(1, 'rgba(170,60,200,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    }
    if (this.kind === 'ingredient') drawIngredient(g, this.id, 0, 0, 1);
    else g.drawImage(Assets.sprite(this.id, this.frame), -this.w / 2, -this.h / 2, this.w, this.h);
    g.restore();
    if ((this.id === 'chag' || this.id === 'skel') && this.state !== 'tapped') {   // tiny companions
      g.save(); g.globalAlpha = this.alpha;
      const n = this.id === 'chag' ? 3 : 2;
      for (let k = 0; k < n; k++) {
        const a = this.t / (this.id === 'chag' ? 500 : 800) + k * Math.PI * 2 / n, R = this.id === 'chag' ? 78 : 70;
        const cx = this.x + Math.cos(a) * R, cy = this.wy() + Math.sin(a) * R * 0.55;
        if (this.id === 'chag') {                                // rotifer: see-through body with a spinning wheel of cilia
          g.fillStyle = 'rgba(255,248,225,0.85)'; g.strokeStyle = 'rgba(120,90,60,0.8)'; g.lineWidth = 1.5;
          g.beginPath(); g.ellipse(cx, cy, 10, 17, a, 0, Math.PI * 2); g.fill(); g.stroke();
          const wx = cx + Math.cos(a - Math.PI / 2) * 16, wy = cy + Math.sin(a - Math.PI / 2) * 16;
          for (let j = 0; j < 6; j++) { const b = this.t / 80 + j; g.beginPath(); g.moveTo(wx, wy); g.lineTo(wx + Math.cos(b) * 9, wy + Math.sin(b) * 9); g.stroke(); }
        } else {                                                 // zooplankton nibbling the food
          g.fillStyle = 'rgba(255,183,77,0.9)'; g.beginPath(); g.ellipse(cx, cy, 13, 9, a + Math.PI / 2, 0, Math.PI * 2); g.fill();
          g.strokeStyle = 'rgba(255,183,77,0.9)'; g.lineWidth = 1.5;

const Particles = {
  list: [],
  add(p) { this.list.push(Object.assign({ vx: 0, vy: 0, r: 5, life: 800, t: 0, kind: 'dot', color: '#fff', grav: 0 }, p)); },
  burst(x, y, color, n = 14, speed = 220, kind = 'dot') {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.6); this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 4 + Math.random() * 6, life: 600, color, kind, grav: -40 }); }
  },
  update(dt) {
    for (const p of this.list) {
      p.t += dt;
      if (p.hx != null) {
        const k = Math.min(1, dt / (p.homeMs || 300)); p.x += (p.hx - p.x) * k; p.y += (p.hy - p.y) * k;
        if (Math.hypot(p.hx - p.x, p.hy - p.y) < 14) { p.t = p.life; if (p.onArrive) p.onArrive(); }
      } else if (p.home) {                                   // homing particles are "absorbed" by a diatom
        if (!p.home.alive) { p.t = p.life; continue; }
        const hx = p.home.x, hy = p.home.wy(), k = Math.min(1, dt / (p.homeMs || 450));
        p.x += (hx - p.x) * k; p.y += (hy - p.y) * k;
        if (Math.hypot(hx - p.x, hy - p.y) < 18) { p.t = p.life; if (p.onArrive) p.onArrive(); }
      } else { p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.vy += p.grav * dt / 1000; }
    }
    this.list = this.list.filter(p => p.t < p.life);
  },
  draw(g) {
    for (const p of this.list) {
      const a = p.fadeIn ? Math.min(1, p.t / 200) * (1 - p.t / p.life) : 1 - p.t / p.life;
      g.globalAlpha = Math.max(0, a);
      if (p.kind === 'dot') { g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill(); }
      else if (p.kind === 'bubble') {
        const r = p.pop ? p.r * (1 + p.t / p.life * 0.8) : p.r;
        g.strokeStyle = p.color; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
        g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.arc(p.x - r * 0.35, p.y - r * 0.35, r * 0.25, 0, Math.PI * 2); g.fill();
      }
      else if (p.kind === 'label') {
        g.fillStyle = p.bg || 'rgba(255,255,255,0.75)'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
        text(g, p.text, p.x, p.y + 1, p.r * 0.85, p.color, 'center', 'bold');
      }
      else if (p.kind === 'drop') {
        g.fillStyle = p.color; g.beginPath(); g.moveTo(p.x, p.y - p.r * 1.6);
        g.quadraticCurveTo(p.x + p.r, p.y, p.x, p.y + p.r); g.quadraticCurveTo(p.x - p.r, p.y, p.x, p.y - p.r * 1.6); g.fill();
      }
      else if (p.kind === 'oil') {
        const gr = g.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, 1, p.x, p.y, p.r);
        gr.addColorStop(0, '#fff8d0'); gr.addColorStop(1, p.color); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
      }
      else if (p.kind === 'spark') {
        const ang = Math.atan2(p.vy, p.vx); g.strokeStyle = p.color; g.lineWidth = 4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - Math.cos(ang) * p.r * 3, p.y - Math.sin(ang) * p.r * 3); g.stroke();
      }
      else if (p.kind === 'slime') { g.fillStyle = p.color; g.beginPath(); g.ellipse(p.x, p.y, p.r * 1.4, p.r, 0, 0, Math.PI * 2); g.fill(); }
      else if (p.kind === 'text') { text(g, p.text, p.x, p.y, p.r, p.color, 'center', 'bold'); }
    }
    g.globalAlpha = 1;
  },
};

function lerpColor(a, b, t) {

  const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}

const FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif';
const font = (size, weight = 'normal') => `${weight} ${size}px ${FONT}`;
function rrect(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function text(g, s, x, y, size, color = '#fff', align = 'center', weight = 'normal') {
  g.font = font(size, weight); g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function wrap(g, s, x, y, maxW, size, color, lineH, align = 'left', weight = 'normal') {
  g.font = font(size, weight); g.fillStyle = color; g.textAlign = align; g.textBaseline = 'top';
  let line = '', yy = y;
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lineH; } else line = t; }
  if (line) { g.fillText(line, x, yy); yy += lineH; }
  return yy;
}
class Button {
  constructor(label, x, y, w, h, onTap, style = 'primary') { Object.assign(this, { label, x, y, w, h, onTap, style, enabled: true }); }
  draw(g) {
    const styles = { primary: ['#ffd65a', '#5a3d00'], secondary: ['#ffffff', '#0b3d5c'], ghost: ['rgba(255,255,255,0.18)', '#ffffff'], locked: ['rgba(255,255,255,0.15)', 'rgba(255,255,255,0.5)'] };
    const [bg, fg] = styles[this.enabled ? this.style : 'locked'];
    g.save(); g.shadowColor = 'rgba(0,0,0,0.25)'; g.shadowBlur = 10; g.shadowOffsetY = 4; rrect(g, this.x, this.y, this.w, this.h, 22); g.fillStyle = bg; g.fill(); g.restore();
    text(g, this.label, this.x + this.w / 2, this.y + this.h / 2 + 1, Math.min(34, this.h * 0.4), fg, 'center', 'bold');

}

function bar(g, x, y, w, h, v, max, fill, back, label) {

const GameScene = {
  enter({ stageId }) {
    const stage = STAGES[stageId], s = save();
    const tools = stage.tutorial ? ['test_kit'] : TOOL_ORDER.filter(t => s.unlockedTools.includes(t));
    const charges = {}; tools.forEach(t => charges[t] = stage.tutorial ? 9 : ProgressSystem.startCharges());
    this.rt = { stageId, stage, hp: s.maxHP, water: stage.startWater, entities: [], ended: false, timeLeft: 0,
                tools: ['hand', ...tools], charges, bag: {}, selected: 'hand', removed: 0, mistakes: 0, farmHits: 0, co2Shield: 0, farmShield: 0, blocked: 0 };
    this.stats = new StatsSystem(this.rt); this.spawn = new SpawnSystem(this.rt); this.bloom = new BloomSystem(this.rt); this.timer = new StageTimer(this.rt);
    this.floaters = []; this.toast = null; this.banner = null; this.endDelay = 0; this.xpGained = 0; this.combo = 0; this.comboT = 0;
    this.shakeT = 0; this.farmFlash = 0; this.farmFx = { toxin: 0, slime: [], panic: 0, drain: 0 }; this.shieldFlash = 0; this.o2Flash = 0; this.beatT = 0; this.lowWarned = false; this.tutStep = 0; this.tutDoneT = 0; this.spotted = new Set();
    this.layoutToolbar();
    EventBus.on('level:up', ({ level, reward }) => { this.stats.add({ hp: save().maxHP }); this.banner = { text: `Level Up!  Lv.${level}`, sub: reward || '', t: 2200 }; Sound.play('levelup'); });
    EventBus.on('bloom', ({ x, y }) => { Sound.play('bloom'); this.float(x, y - 70, 'Bloom!', '#ffcc80'); });
  },
  layoutToolbar() {
    const items = [...this.rt.tools, ...(this.rt.stage.tutorial ? [] : ['lab'])];
    const n = items.length, w = Math.min(130, (CONFIG.W - 20 - (n - 1) * 8) / n), total = n * w + (n - 1) * 8, x0 = (CONFIG.W - total) / 2;
    this.slots = items.map((id, i) => ({ id, x: x0 + i * (w + 8), y: CONFIG.PLAY_BOTTOM + 14, w, h: CONFIG.H - CONFIG.PLAY_BOTTOM - 28 }));
    this.pauseBtn = { x: 646, y: 18, w: 60, h: 60 };
  },
  update(dt) {
    const rt = this.rt;
    Sound.musicTick(dt);
    if (!rt.ended) { this.timer.tick(dt); this.stats.tick(dt); this.spawn.tick(dt); rt.co2Shield = Math.max(0, rt.co2Shield - dt); }
    rt.entities.forEach(e => e.update(dt));
    for (const e of rt.entities) if (e.alive && e.state === 'drifting' && SPECIES_FX[e.id]) SPECIES_FX[e.id](e);
    const fx = this.farmFx; fx.toxin = Math.max(0, fx.toxin - dt / 3000); fx.panic = Math.max(0, fx.panic - dt / 2500); fx.drain = Math.max(0, fx.drain - dt / 3000);
    fx.slime.forEach(s => s.life -= dt); fx.slime = fx.slime.filter(s => s.life > 0);
    for (const e of rt.entities) {
      if (e.alive && e.state === 'drifting' && (e.kind === 'helpful' || e.kind === 'harmful') && !this.spotted.has(e.id) && e.x > 60 && e.x < 660) {
        this.spotted.add(e.id);
        if (!save().seenDiatoms.includes(e.id)) { save().seenDiatoms.push(e.id); SaveManager.save(); Sound.play('spot'); Scenes.push(CardScene, { id: e.id, first: true }); return; }
      }
      if (e.alive && e.reachedFarm()) {
        e.alive = false;
        if (rt.stage.tutorial) continue;
        if (rt.farmShield > 0) {
          rt.farmShield--; rt.blocked++; this.shieldFlash = 1; Sound.play('shield');
          for (let i = 0; i < 16; i++) { const a = rnd(3.3, 6.1), sp = rnd(120, 240); Particles.add({ kind: 'dot', color: 'rgba(128,222,234,0.95)', r: rnd(4, 8), x: e.x, y: FARM_TOP() + 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 600 }); }
          this.float(e.x, FARM_TOP() - 20, 'Blocked by shield!', '#80deea'); continue;
        }
        this.stats.add({ water: CONFIG.FARM_HIT_WATER }); rt.farmHits++;
        this.farmHitFx(e);
        this.shakeT = 300; this.farmFlash = 1; Sound.play('farm'); this.breakCombo();
      }
    }
    rt.entities = rt.entities.filter(e => e.alive);
    if (!rt.ended) {
      this.bloom.tick(dt);
      const res = this.timer.check();
      if (res) { rt.ended = true; this.result = res; this.endDelay = 1100; Sound.play(res.win ? 'clear' : 'lose'); }
    } else if (this.endDelay > 0) { this.endDelay -= dt; if (this.endDelay <= 0) this.finish(); }
    Particles.update(dt);
    this.floaters.forEach(f => { f.t += dt; f.y -= dt * 0.06; }); this.floaters = this.floaters.filter(f => f.t < 900);
    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
    this.shakeT = Math.max(0, this.shakeT - dt); this.farmFlash = Math.max(0, this.farmFlash - dt / 500); this.shieldFlash = Math.max(0, this.shieldFlash - dt / 600); this.o2Flash = Math.max(0, this.o2Flash - dt / 400);
    if (!rt.ended && !rt.stage.tutorial && rt.hp < 35) {        // low oxygen: heartbeat + one reminder
      this.beatT -= dt; if (this.beatT <= 0) { this.beatT = 300 + rt.hp * 20; Sound.play('beat'); }
      if (!this.lowWarned) { this.lowWarned = true; this.say('Low oxygen! Collect helpful diatoms with your HAND.', true); }
    } else if (rt.hp > 50) this.lowWarned = false;
    if (this.tutDoneT > 0) { this.tutDoneT -= dt; if (this.tutDoneT <= 0) Scenes.start(MapScene); }
  },
  finish() {
    const r = this.result, id = this.rt.stageId, st = this.rt.stage, s = save();
    const newTools = [];
    if (r.win) {
      s.stars[id] = Math.max(s.stars[id] || 0, r.stars);
      if (st.next && !s.unlockedStages.includes(st.next)) s.unlockedStages.push(st.next);
      (st.unlockTools || []).forEach(t => { if (!s.unlockedTools.includes(t)) { s.unlockedTools.push(t); newTools.push(t); } });
      SaveManager.save();
    }
    Scenes.start(ResultScene, { stageId: id, ...r, xpGained: this.xpGained, water: Math.round(this.rt.water), removed: this.rt.removed, mistakes: this.rt.mistakes, farmHits: this.rt.farmHits, blocked: this.rt.blocked, newTools });
  },
  o2Bubbles(x, y) {                              // oxygen bubbles fly from the diatom into the O2 bar
    const rt = this.rt, tx = 100 + 360 * Math.min(1, rt.hp / save().maxHP);
    for (let i = 0; i < 7; i++) Particles.add({ kind: 'bubble', color: 'rgba(224,247,250,1)', r: rnd(8, 13), x: x + rnd(-30, 30), y: y + rnd(-30, 30),
      hx: Math.max(120, tx - 10), hy: 41, homeMs: 220 + i * 40, life: 2500, onArrive: () => { this.o2Flash = 1; } });
  },
  power(e) {                                    // each helpful diatom gives a power based on its real trait
    const rt = this.rt, x = e.x, y = e.wy();
    Sound.play('power');
    if (e.id === 'thal') {
      rt.co2Shield = 10000; this.stats.add({ hp: 7 });
      this.float(x, y - 80, 'CO\u2082 Shield! 10s', '#c8e6c9');
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; Particles.add({ kind: 'label', text: 'CO\u2082', r: 16, color: '#37474f', bg: 'rgba(236,239,241,0.95)', x: x + Math.cos(a) * 120, y: y + Math.sin(a) * 120, home: e, homeMs: 200, life: 700 }); }
    } else if (e.id === 'skel') {
      this.stats.add({ water: 5 }); this.farmFx.slime = [];
      this.float(x, y - 80, 'Farm fed! Water +5', '#dce775');
      for (let i = 0; i < 18; i++) Particles.add({ kind: 'dot', color: 'rgba(212,225,87,1)', r: rnd(4, 7), x: x + rnd(-40, 40), y, vx: rnd(-40, 40), vy: rnd(150, 300), life: 1500 });
    } else if (e.id === 'phae') {
      const tools = rt.tools.filter(t => t !== 'hand');
      if (tools.length) {
        const t = tools.reduce((a, b) => rt.charges[b] < rt.charges[a] ? b : a); rt.charges[t]++;
        this.float(x, y - 80, `Bio-energy! +1 ${TOOLS[t].name}`, '#ffd54f');
        const sl = this.slots.find(s => s.id === t);
        for (let i = 0; i < 10; i++) Particles.add({ kind: 'oil', color: '#ffb300', r: rnd(6, 10), x: x + rnd(-30, 30), y: y + rnd(-30, 30), vx: (sl.x + sl.w / 2 - x) * rnd(0.9, 1.3), vy: (sl.y - y) * rnd(0.9, 1.3), life: 1000 });
      }
    } else if (e.id === 'chag') {
      rt.farmShield = Math.min(2, rt.farmShield + 1); this.shieldFlash = 1;
      this.float(x, y - 80, 'Farm Shield!', '#80deea');
    }
  },
  farmHitFx(e) {
    const fx = this.farmFx, y = FARM_TOP() + 60;
    const msg = { pseu: 'Shellfish poisoned!', chae: 'Fish gills hurt!', cosc: 'Oxygen dropping!', euca: 'Nutrients stolen!' }[e.id];
    this.float(e.x, FARM_TOP() - 10, `${msg} ${CONFIG.FARM_HIT_WATER}`, '#ff8a80');
    if (e.id === 'pseu') { fx.toxin = 1; for (let i = 0; i < 16; i++) Particles.add({ kind: 'drop', color: 'rgba(156,39,176,0.9)', r: rnd(5, 8), x: e.x + rnd(-60, 60), y: y - 40, vx: rnd(-60, 60), vy: rnd(-120, -40), grav: 300, life: 900 }); }
    if (e.id === 'chae') { fx.panic = 1; for (let i = 0; i < 14; i++) { const a = rnd(3.4, 6.0), sp = rnd(160, 260); Particles.add({ kind: 'spark', color: '#ffffff', r: 7, x: e.x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 450 }); } }
    if (e.id === 'cosc') { fx.slime.push({ x: e.x, w: rnd(60, 90), life: 20000 }); for (let i = 0; i < 10; i++) Particles.add({ kind: 'bubble', pop: true, color: 'rgba(255,255,255,0.9)', r: rnd(6, 12), x: e.x + rnd(-90, 90), y: y + rnd(-30, 20), life: 500 + i * 60 }); }
    if (e.id === 'euca') { fx.drain = 1; for (let i = 0; i < 12; i++) { const n = i % 2 === 0; Particles.add({ kind: 'label', text: n ? 'N' : 'P', r: 13, color: '#fff', bg: n ? 'rgba(102,187,106,0.95)' : 'rgba(171,71,188,0.95)', x: e.x + rnd(-120, 120), y: y + rnd(0, 50), vx: rnd(-20, 20), vy: rnd(-260, -160), life: 1100 }); } }
  },
  float(x, y, s, color) { this.floaters.push({ x, y, s, color, t: 0 }); },
  say(text, good) { this.toast = { text, good, t: CONFIG.TOAST_MS }; },
  good() { this.combo++; this.comboT = CONFIG.COMBO_WINDOW; if (this.combo >= 3) { this.stats.add({ water: 1 }); } },
  breakCombo() { this.combo = 0; this.comboT = 0; },
  onPointer(x, y) {
    const rt = this.rt;
    const pb = this.pauseBtn;
    if (x > pb.x && x < pb.x + pb.w && y > pb.y && y < pb.y + pb.h) { Sound.play('click'); Scenes.push(PauseScene); return; }
    for (const sl of this.slots) if (x > sl.x && x < sl.x + sl.w && y > sl.y && y < sl.y + sl.h) {
      if (sl.id === 'lab') { Sound.play('click'); Scenes.push(LabScene, { game: this }); }
      else { rt.selected = sl.id; Sound.play('select'); if (rt.stage.tutorial && this.tutStep === 1 && sl.id === 'test_kit') this.tutStep = 2; }
      return;
    }
    if (rt.ended || y < CONFIG.PLAY_TOP || y > CONFIG.PLAY_BOTTOM) return;
    const ents = rt.entities;
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i]; if (!e.hit(x, y)) continue;
      this.act(e); return;
    }
  },
  act(e) {

    if (tool === 'hand') {
      if (e.kind === 'ingredient') {
        e.state = 'tapped'; rt.bag[e.id] = (rt.bag[e.id] || 0) + 1; Sound.play('ingredient');

        this.stats.add({ hp: CONFIG.HELPFUL_HP, water: CONFIG.HELPFUL_WATER }); Sound.play('collect', this.combo);
        this.float(e.x, e.wy() - 40, `+${CONFIG.HELPFUL_HP} O\u2082`, '#b2ebf2'); this.o2Bubbles(e.x, e.wy()); Particles.burst(e.x, e.wy(), 'rgba(150,255,170,0.9)', 10, 180);
        this.xpGained += CONFIG.HELPFUL_XP; ProgressSystem.addXP(CONFIG.HELPFUL_XP);
        this.power(e);
        if (rt.stage.tutorial && this.tutStep === 0) { this.tutStep = 1; rt.selected = 'hand'; }
      } else {
        this.stats.add({ hp: CONFIG.HAND_ON_HARMFUL_HP }); e.shake = 1; rt.mistakes++; this.breakCombo(); Sound.play('hurt');
        this.float(e.x, e.wy() - 40, `${CONFIG.HAND_ON_HARMFUL_HP} O\u2082`, '#ff8a80');
        this.say(`Ouch! ${d.short} is harmful. Use the ${TOOLS[d.tool].name}!`, false);
      }
      return;
    }
    // a tool is selected
    if (e.kind === 'ingredient') return;
    if (rt.charges[tool] <= 0) { Sound.play('empty'); this.say(`No ${TOOLS[tool].name} left. Make more in the Lab!`, false); return; }
    rt.charges[tool]--;
    if (e.kind === 'helpful') {
      e.state = 'tapped'; rt.mistakes++; this.breakCombo(); Sound.play('wrong');
      this.stats.add({ water: CONFIG.TOOL_ON_HELPFUL_WATER }); this.float(e.x, e.wy() - 40, `${CONFIG.TOOL_ON_HELPFUL_WATER} water`, '#ff8a80');
      this.say(`Oh no! ${d.short} was a helpful diatom.`, false);
    } else if (d.tool === tool) {
      e.state = 'tapped'; rt.removed++; this.good(); Sound.play('remove', this.combo);
      this.stats.add({ water: CONFIG.REMOVE_WATER }); Particles.burst(e.x, e.wy(), TOOLS[tool].color, 18, 260);
      this.float(e.x, e.wy() - 40, this.combo >= 3 ? `Combo x${this.combo}!` : 'Removed!', '#ffffff');
      if (rt.stage.tutorial && this.tutStep === 2) { this.tutStep = 3; save().tutorialDone = true; SaveManager.save(); rt.ended = true; this.banner = { text: 'Great job!', sub: 'You are ready for Stage 1', t: 99999 }; this.tutDoneT = 2000; Sound.play('clear'); }
    } else {
      e.shake = 1; rt.mistakes++; this.breakCombo(); Sound.play('wrong');
      this.stats.add({ water: CONFIG.WRONG_TOOL_WATER });
      this.say(`Wrong tool! ${d.short} needs the ${TOOLS[d.tool].name}.`, false);
    }
  },
  draw(g) {
    const rt = this.rt, st = rt.stage;
    g.save();
    if (this.shakeT > 0) g.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
    drawWater(g, st.bg, clock, st.tutorial ? 0 : Math.max(0, (60 - rt.water) / 60), st.tutorial ? 16 : Math.round(2 + 16 * rt.water / 100));
    drawFarm(g, st.farm, rt.water, clock, this.farmFlash, this.farmFx);
    if (rt.farmShield > 0 || this.shieldFlash > 0) {           // glowing shield above the farm
      const y0 = FARM_TOP() + 6, a = 0.25 + Math.sin(clock / 250) * 0.08 + this.shieldFlash * 0.4;
      const gr = g.createLinearGradient(0, y0 - 30, 0, y0 + 20); gr.addColorStop(0, 'rgba(128,222,234,0)'); gr.addColorStop(1, `rgba(128,222,234,${Math.min(0.8, a)})`);
      g.fillStyle = gr; g.fillRect(0, y0 - 30, CONFIG.W, 50);
      g.strokeStyle = `rgba(178,235,242,${Math.min(1, a + 0.4)})`; g.lineWidth = 4; g.beginPath(); g.moveTo(0, y0 + 18); g.lineTo(CONFIG.W, y0 + 18); g.stroke();
      if (rt.farmShield > 0) { rrect(g, 560, y0 - 22, 140, 36, 18); g.fillStyle = 'rgba(0,96,100,0.85)'; g.fill(); text(g, `Shield x${rt.farmShield}`, 630, y0 - 3, 20, '#e0f7fa', 'center', 'bold'); }
    }
    rt.entities.forEach(e => e.draw(g));
    Particles.draw(g);
    this.floaters.forEach(f => { g.globalAlpha = 1 - f.t / 900; text(g, f.s, f.x, f.y, 32, f.color, 'center', 'bold'); g.globalAlpha = 1; });
    g.restore();
    // HUD
    g.fillStyle = 'rgba(6,38,58,0.85)'; g.fillRect(0, 0, CONFIG.W, CONFIG.HUD_BOTTOM);
    text(g, 'O\u2082', 26, 40, 26, '#b2ebf2', 'left', 'bold');
    if (this.o2Flash > 0) { g.save(); g.shadowColor = '#e0f7fa'; g.shadowBlur = 30 * this.o2Flash; rrect(g, 100, 24, 360, 34, 17); g.fillStyle = 'rgba(224,247,250,0.4)'; g.fill(); g.restore(); }
    bar(g, 100, 24, 360, 34, rt.hp, save().maxHP, rt.co2Shield > 0 ? '#66bb6a' : rt.hp < 35 ? '#ef5350' : '#26c6da', 'rgba(255,255,255,0.15)', rt.co2Shield > 0 ? `${Math.ceil(rt.hp)}  \u00b7  CO\u2082 Shield ${Math.ceil(rt.co2Shield / 1000)}s` : `${Math.ceil(rt.hp)}`);
    text(g, 'Water', 26, 92, 22, '#a9dcff', 'left', 'bold');
    bar(g, 100, 75, 360, 34, rt.water, 100, rt.water >= st.passWater ? '#42a5f5' : '#ffa726', 'rgba(255,255,255,0.15)', `${Math.round(rt.water)}`);
    if (st.passWater) { const mx = 100 + 360 * st.passWater / 100; g.fillStyle = '#fff'; g.fillRect(mx - 2, 70, 4, 44); }
    const nl = ProgressSystem.nextLevel(), s = save(), prev = LEVELS.find(l => l.level === s.level).xp;
    text(g, `Lv.${s.level}`, 26, 140, 22, '#c5f5b0', 'left', 'bold');
    bar(g, 100, 130, 360, 20, nl ? s.xp - prev : 1, nl ? nl.xp - prev : 1, '#8bc34a', 'rgba(255,255,255,0.15)');
    if (st.duration) {
      const sec = Math.ceil(rt.timeLeft / 1000);
      text(g, `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`, 550, 50, 48, sec <= 10 ? '#ffcc80' : '#fff', 'center', 'bold');
    } else text(g, 'Practice', 550, 50, 32, '#fff', 'center', 'bold');
    if (this.combo >= 3) text(g, `Combo x${this.combo}`, 550, 120, 30, '#ffd65a', 'center', 'bold');
    rrect(g, this.pauseBtn.x, this.pauseBtn.y, 60, 60, 16); g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill(); drawToolIcon(g, 'pause', 676, 48);
    if (!st.tutorial && rt.hp < 35) {
      const a = (35 - rt.hp) / 35 * (0.55 + Math.sin(clock / 180) * 0.15);
      const gr = g.createRadialGradient(360, 640, 200, 360, 640, 720); gr.addColorStop(0, 'rgba(40,0,0,0)'); gr.addColorStop(1, `rgba(60,0,10,${a})`);
      g.fillStyle = gr; g.fillRect(0, CONFIG.HUD_BOTTOM, CONFIG.W, CONFIG.PLAY_BOTTOM - CONFIG.HUD_BOTTOM);
    }
    // toolbar
    g.fillStyle = 'rgba(6,38,58,0.9)'; g.fillRect(0, CONFIG.PLAY_BOTTOM, CONFIG.W, CONFIG.H - CONFIG.PLAY_BOTTOM);
    for (const sl of this.slots) {
      const sel = sl.id === rt.selected, isTool = TOOLS[sl.id] && sl.id !== 'hand';
      rrect(g, sl.x, sl.y, sl.w, sl.h, 18); g.fillStyle = sel ? '#ffd65a' : 'rgba(255,255,255,0.14)'; g.fill();
      if (sel) { g.strokeStyle = '#fff'; g.lineWidth = 4; g.stroke(); }
      drawToolIcon(g, sl.id, sl.x + sl.w / 2, sl.y + 50, 1.05);
      text(g, sl.id === 'lab' ? 'Lab' : TOOLS[sl.id].name, sl.x + sl.w / 2, sl.y + sl.h - 22, 19, sel ? '#5a3d00' : '#fff', 'center', 'bold');
      if (isTool) {
        const c = rt.charges[sl.id]; g.fillStyle = c > 0 ? '#ef5350' : '#777';
        g.beginPath(); g.arc(sl.x + sl.w - 16, sl.y + 16, 16, 0, Math.PI * 2); g.fill(); text(g, String(c), sl.x + sl.w - 16, sl.y + 17, 18, '#fff', 'center', 'bold');
      }
      if (sl.id === 'lab') {
        const n = Object.values(rt.bag).reduce((a, b) => a + b, 0);
        if (n) { g.fillStyle = '#7e57c2'; g.beginPath(); g.arc(sl.x + sl.w - 16, sl.y + 16, 16, 0, Math.PI * 2); g.fill(); text(g, String(n), sl.x + sl.w - 16, sl.y + 17, 18, '#fff', 'center', 'bold'); }
      }
    }
    // messages
    if (st.tutorial && !rt.ended) {
      const msg = ['1. Select HAND, then tap the round helpful diatom', '2. Now select the TEST KIT below', '3. Tap the long red Pseudo-nitzschia'][this.tutStep];
      panel(g, 40, 190, 640, 70, 'rgba(255,255,255,0.93)'); text(g, msg, 360, 226, 25, '#0b3d5c', 'center', 'bold');
    }
    if (this.toast) {
      panel(g, 50, 880, 620, 80, 'rgba(255,255,255,0.95)');
      g.save(); rrect(g, 50, 880, 620, 80, 28); g.clip(); wrap(g, this.toast.text, 360, 893, 580, 25, this.toast.good ? '#2e7d32' : '#c62828', 30, 'center', 'bold'); g.restore();
    }
    if (this.banner) {
      panel(g, 110, 520, 500, 190, 'rgba(255,214,90,0.97)');
      text(g, this.banner.text, 360, 590, 52, '#5a3d00', 'center', 'bold');
      if (this.banner.sub) wrap(g, this.banner.sub, 360, 635, 460, 22, '#5a3d00', 28, 'center');
    }
    if (rt.ended && this.result) {
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 0, CONFIG.W, CONFIG.H);
      text(g, this.result.win ? 'Time up!' : 'Oh no!', 360, 640, 80, '#fff', 'center', 'bold');
    }
  },
};

const CardScene = {
  enter({ id, first }) {
    this.id = id; this.first = first; this.d = DIATOMS[id];
    this.btn = new Button(first ? 'Got it!' : 'Close', 210, 1030, 300, 100, () => Scenes.pop());
  },
  update(dt) { Sound.musicTick(dt); },
  draw(g) {
    g.fillStyle = 'rgba(0,20,35,0.6)'; g.fillRect(0, 0, CONFIG.W, CONFIG.H);
    const d = this.d, good = d.type === 'helpful';
    panel(g, 50, 110, 620, 1050);
    rrect(g, 230, 140, 260, 54, 27); g.fillStyle = good ? '#2e7d32' : '#c62828'; g.fill();
    text(g, good ? 'HELPFUL' : 'HARMFUL', 360, 168, 28, '#fff', 'center', 'bold');
    if (this.first) text(g, 'New diatom spotted! Remember its shape.', 360, 228, 24, '#5b7a8a');
    drawSprite(g, this.id, Math.floor(clock / 500), 360, 400, 250);
    wrap(g, d.name, 360, 545, 560, 32, '#0b3d5c', 40, 'center', 'bold');
    let y = 640;
    text(g, `Special ability: ${d.ability}`, 360, y, 27, good ? '#2e7d32' : '#c62828', 'center', 'bold');
    y = wrap(g, d.card, 100, y + 36, 520, 27, '#1d3440', 39);
    if (good) { y = wrap(g, `Collect with HAND \u2192 ${d.power}`, 360, y + 10, 540, 26, '#2e7d32', 32, 'center', 'bold'); wrap(g, d.powerText, 360, y + 2, 540, 22, '#2e7d32', 28, 'center'); }
    else {                                   // icon + text centered together, measured so they never overlap
      const label = `Remove it with the ${TOOLS[d.tool].name}`;
      g.font = font(26, 'bold'); const tw = g.measureText(label).width, total = 50 + 14 + tw, x0 = 360 - total / 2;
      drawToolIcon(g, d.tool, x0 + 25, y + 40, 0.9); text(g, label, x0 + 64, y + 40, 26, '#c62828', 'left', 'bold');
    }
    text(g, `Affects: ${d.target}`, 360, 995, 22, '#5b7a8a');
    this.btn.draw(g);
  },
  onPointer(x, y) { tapButtons([this.btn], x, y); },
};

const LabScene = {
  enter({ game }) {
    this.game = game; this.rt = game.rt;
    this.close = new Button('Back to water', 160, 1110, 400, 100, () => Scenes.pop());
    this.rows = this.rt.tools.filter(t => t !== 'hand').map((t, i) => ({ t, y: 300 + i * 190, btn: new Button('Make +3', 470, 300 + i * 190 + 40, 170, 80, () => this.craft(t)) }));
  },
  craft(t) {
    const [a, b] = TOOLS[t].recipe, bag = this.rt.bag;
    if ((bag[a] || 0) < 1 || (bag[b] || 0) < 1) { Sound.play('empty'); return; }
    bag[a]--; bag[b]--; this.rt.charges[t] += CONFIG.CRAFT_CHARGES; Sound.play('craft');
  },
  update(dt) { Sound.musicTick(dt); },
  draw(g) {
    g.fillStyle = 'rgba(30,10,50,0.85)'; g.fillRect(0, 0, CONFIG.W, CONFIG.H);
    text(g, 'Laboratory', 360, 110, 56, '#fff', 'center', 'bold');
    text(g, 'Mix 2 ingredients to make 3 more charges', 360, 175, 26, '#e1bee7');
    text(g, '(the game is paused)', 360, 215, 22, 'rgba(255,255,255,0.6)');
    for (const r of this.rows) {
      const tool = TOOLS[r.t], [a, b] = tool.recipe, bag = this.rt.bag, ok = (bag[a] || 0) > 0 && (bag[b] || 0) > 0;
      panel(g, 40, r.y, 640, 170, 'rgba(255,255,255,0.95)');
      drawToolIcon(g, r.t, 100, r.y + 60, 1.2);
      text(g, tool.name, 100, r.y + 120, 20, '#0b3d5c', 'center', 'bold');
      text(g, `x${this.rt.charges[r.t]}`, 100, r.y + 148, 20, '#c62828', 'center', 'bold');
      [a, b].forEach((ing, k) => {
        const x = 220 + k * 120, have = bag[ing] || 0;
        g.globalAlpha = have ? 1 : 0.35; drawIngredient(g, ing, x, r.y + 62, 0.9); g.globalAlpha = 1;
        text(g, INGREDIENTS[ing].short, x, r.y + 118, 18, '#1d3440', 'center', 'bold');
        text(g, `have ${have}`, x, r.y + 144, 18, have ? '#2e7d32' : '#999', 'center');
      });
      text(g, '+', 280, r.y + 62, 32, '#1d3440', 'center', 'bold');
      r.btn.enabled = ok; r.btn.draw(g);
    }
    this.close.draw(g);
  },
  onPointer(x, y) { tapButtons([this.close, ...this.rows.map(r => r.btn)], x, y); },
};

const PauseScene = {
  enter() {
    this.btns = [new Button('Resume', 160, 480, 400, 110, () => Scenes.pop()), new Button('Quit to map', 160, 630, 400, 100, () => Scenes.start(MapScene), 'secondary'), soundButton(255, 780)];
  },
  update() {},
  draw(g) { g.fillStyle = 'rgba(0,20,35,0.65)'; g.fillRect(0, 0, CONFIG.W, CONFIG.H); text(g, 'Paused', 360, 380, 70, '#fff', 'center', 'bold'); this.btns.forEach(b => b.draw(g)); },
  onPointer(x, y) { tapButtons(this.btns, x, y); },
};

const ResultScene = {
  enter(r) {
    this.r = r; const st = STAGES[r.stageId];
    this.btns = [new Button('Retry', 80, 1020, 260, 100, () => Scenes.start(IntroScene, { stageId: r.stageId }), 'secondary')];
    if (r.win && st.next) this.btns.push(new Button('Next', 380, 1020, 260, 100, () => Scenes.start(MapScene)));
    else if (r.win) this.btns.push(new Button('Finish', 380, 1020, 260, 100, () => Scenes.start(EndingScene)));
    else this.btns.push(new Button('Map', 380, 1020, 260, 100, () => Scenes.start(MapScene)));
  },
  update(dt) { Sound.musicTick(dt); },
  draw(g) {
    const r = this.r, st = STAGES[r.stageId];
    drawWater(g, st.bg, clock); panel(g, 50, 150, 620, 820);
    text(g, st.name, 360, 215, 30, '#5b7a8a');
    if (r.win) { text(g, 'Stage Clear!', 360, 290, 64, '#2e7d32', 'center', 'bold'); text(g, '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars), 360, 395, 90, '#e8a900'); }
    else { const L = LOSE_TEXT[r.reason]; text(g, L.title, 360, 290, 50, '#c62828', 'center', 'bold'); wrap(g, L.tip, 100, 350, 520, 26, '#1d3440', 36); }
    const rows = [['Water quality', r.water], ['Harmful removed', r.removed], ['Farm hits / blocked', `${r.farmHits} / ${r.blocked}`], ['Mistakes', r.mistakes], ['XP earned', `+${r.xpGained}`]];
    rows.forEach(([k, v], i) => { const y = 500 + i * 56; text(g, k, 130, y, 28, '#1d3440', 'left'); text(g, String(v), 590, y, 30, '#0b3d5c', 'right', 'bold'); });
    if (r.newTools && r.newTools.length) {
      text(g, 'New tools unlocked!', 360, 815, 28, '#6a1b9a', 'center', 'bold');
      r.newTools.forEach((t, i) => { const x = 360 + (i - (r.newTools.length - 1) / 2) * 150; drawToolIcon(g, t, x, 875, 1); text(g, TOOLS[t].name, x, 920, 20, '#0b3d5c', 'center', 'bold'); });
    }
    this.btns.forEach(b => b.draw(g));
  },
  onPointer(x, y) { tapButtons(this.btns, x, y); },
};

const BookScene = {
  enter() {
    this.back = new Button('Back', 30, 1150, 180, 90, () => Scenes.start(TitleScene), 'ghost');
    this.cells = DIATOM_ORDER.map((id, i) => ({ id, x: 40 + (i % 2) * 330, y: 200 + Math.floor(i / 2) * 230, w: 310, h: 210 }));
  },
  update(dt) { Sound.musicTick(dt); },
  draw(g) {
    drawWater(g, ['#9fe0e6', '#16577a'], clock);
    const seen = save().seenDiatoms;
    text(g, 'Diatom Book', 360, 90, 54, '#fff', 'center', 'bold');
    text(g, `${seen.length} / 8 found · tap one to study it`, 360, 150, 26, '#e8fbff');
    for (const c of this.cells) {
      const ok = seen.includes(c.id), d = DIATOMS[c.id];
      panel(g, c.x, c.y, c.w, c.h, ok ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.35)');
      drawSprite(g, c.id, Math.floor(clock / 500), c.x + c.w / 2, c.y + 85, 130, !ok);
      text(g, ok ? d.short : '???', c.x + c.w / 2, c.y + 172, 26, ok ? (d.type === 'helpful' ? '#2e7d32' : '#c62828') : '#fff', 'center', 'bold');
    }
    this.back.draw(g);
  },
  onPointer(x, y) {
    if (tapButtons([this.back], x, y)) return;
    for (const c of this.cells) if (x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h && save().seenDiatoms.includes(c.id)) { Sound.play('click'); Scenes.push(CardScene, { id: c.id, first: false }); }
  },
};

const EndingScene = {
  enter() { this.btn = new Button('Back to title', 160, 1050, 400, 100, () => Scenes.start(TitleScene)); Sound.play('clear'); },
  update(dt) { Sound.musicTick(dt); },
  draw(g) {
    drawWater(g, ['#bfeaf0', '#2f8f9d'], clock); panel(g, 50, 160, 620, 830);
    text(g, 'Certificate', 360, 240, 34, '#5b7a8a');
    text(g, 'Water Guardian', 360, 320, 64, '#0b3d5c', 'center', 'bold');
    ['thal', 'skel', 'phae', 'chag'].forEach((id, i) => drawSprite(g, id, Math.floor(clock / 400) + i, 150 + i * 140, 470, 120));
    wrap(g, 'You saved the waters of Korea and Taiwan from harmful diatom blooms!', 100, 580, 520, 32, '#1d3440', 46);
    wrap(g, 'Real-life tip: do not eat shellfish from areas with a toxin warning.', 100, 780, 520, 28, '#0b6e8a', 40, 'left', 'bold');
    this.btn.draw(g);
  },
  onPointer(x, y) { tapButtons([this.btn], x, y); },
};

/* ---------------- main loop ---------------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(50, ts - (last || ts)); last = ts; clock += dt;
  const top = Scenes.top(); if (top && top.update) top.update(dt);   // only the top scene updates: overlays pause the game
  ctx.clearRect(0, 0, CONFIG.W, CONFIG.H);
  Scenes.stack.forEach(s => s.draw(ctx));
  requestAnimationFrame(frame);
}
resize(); SaveManager.load();
Assets.load().then(() => { Scenes.start(TitleScene); requestAnimationFrame(frame); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Scenes.top() === GameScene && !GameScene.rt.ended) Scenes.push(PauseScene); });
</script>
</body>
